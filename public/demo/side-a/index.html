    <style id="boot-splash-style">

      #boot-splash .bs-disc { animation: bs-spin 1.8s linear .1s infinite; }
      #boot-splash .bs-arm { transform-origin: 91.83% 16.67%; animation: bs-arm .75s cubic-bezier(.33, 0, .2, 1) .35s both; }
      #boot-splash .bs-word { position: absolute; top: calc(100% + 26px); left: -80px; right: -80px; text-align: center; font: 700 20px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: 4px; color: #242723; animation: bs-word .45s cubic-bezier(.33, 1, .68, 1) .75s both; }
      #boot-splash.bs-exit { opacity: 0; }
      #boot-splash.bs-exit .bs-stage { transform: scale(1.15); }

      @keyframes bs-arm { from { opacity: 0; transform: rotate(-40deg); } 35% { opacity: 1; } to { opacity: 1; transform: none; } }
      @keyframes bs-word { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-color-scheme: dark) {

      @media (prefers-reduced-motion: reduce) {
        #boot-splash * { animation: none !important; }
        #boot-splash .bs-stage { transition: none; }
        #boot-splash.bs-exit { transition-duration: .2s; }
